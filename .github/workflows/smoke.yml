name: Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Proof of Shipping
        uses: ./
        with:
          github-token: ${{ github.token }}
          period-days: "90"