name: Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Proof of Shipping
        uses: ./
        with:
          github-token: ${{ github.token }}
          period-days: "90"

      - name: Verify generated SVG
        run: |
          test -s proof-of-shipping.svg
          echo "SVG generated successfully"
          ls -lh proof-of-shipping.svg
          head -n 5 proof-of-shipping.svg
      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proof-of-shipping.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
          else
            git commit -m "chore: update proof of shipping card"
            git push
          fi
      - name: Upload SVG preview
        uses: actions/upload-artifact@v7
        with:
          name: proof-of-shipping-preview
          path: proof-of-shipping.svg
          if-no-files-found: error