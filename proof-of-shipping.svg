    @hamza-topo
  </text>

  <rect
    x="408"
    y="20"
    width="88"
    height="26"
    rx="13"
    fill="#21262d"
  />

  <text
    x="452"
    y="37"
    text-anchor="middle"
    class="badge"
  >
    LAST 90 DAYS
  </text>

  <!-- Metrics -->

  <rect
    x="24"
    y="78"
    width="228"
    height="78"
    rx="10"
    fill="#161b22"
    stroke="#30363d"
  />

  <text
    x="42"
    y="103"
    class="metric-label"
  >
    RELEASES
  </text>

  <text
    x="42"
    y="137"
    class="metric-value"
  >
    0
  </text>

  <circle
    cx="225"
    cy="103"
    r="4"
    class="accent"
  />

  <rect
    x="268"
    y="78"
    width="228"
    height="78"
    rx="10"
    fill="#161b22"
    stroke="#30363d"
  />

  <text
    x="286"
    y="103"
    class="metric-label"
  >
    MERGED PRS
  </text>

  <text
    x="286"
    y="137"
    class="metric-value"
