    7
  </text>

  <circle
    cx="469"
    cy="103"
    r="4"
    class="accent"
  />

  <!-- Latest delivery -->

  <text
    x="24"
    y="188"
    class="section-label"
  >
    LATEST DELIVERY
  </text>

  <text
    x="24"
    y="215"
    class="delivery-heading"
  >
    petmingle · PR #101
  </text>

  <text
    x="24"
    y="238"
    class="delivery-description"
  >
    Enforce relational integrity and transactional match crea…
  </text>

  <text
    x="24"
    y="260"
    class="delivery-date"
  >
    Sep 27, 2026
  </text>

  <!-- Footer -->

  <line
    x1="24"
    y1="280"
    x2="496"
    y2="280"
    stroke="#30363d"
  />

  <text
    x="24"
    y="300"
    class="footer"
  >
    7 shipping events
  </text>
</svg>